
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galaxy Cats ★</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="login-card">

        <div class="lock-icon">🐈‍⬛</div>

        <p class="eyebrow">✦ GALAXY SYSTEM ✦</p>

        <h1>Olá, viajante!</h1>

        <p class="subtitle">
            Entre no universo dos gatinhos cósmicos 🌙
        </p>

        <form id="loginForm">

            <label for="usuario">✧ Usuário</label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário..."
                required
            >

            <label for="senha">✧ Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha..."
                required
            >

            <button type="submit">
                ENTRAR NA GALÁXIA ✦
            </button>

        </form>

        <p class="rodape">
            ⋆｡°✩ GALAXY CAT SPACE ✩°｡⋆
        </p>

    </main>

</body>
</html>
