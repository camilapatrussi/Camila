<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar consulta com Nutricionista</title>
</head>
<body>
    <center>
        <H1>Agendar Consulta</H1>
        <form action="http://127.0.0.1:3000" method="post">
            <input type="number" placeholder="Identificacao" name="id" required><br><br>

            <input type="date" placeholder="Data" name="data" required><br><br>

            <input type="text" placeholder="seu nome" name="paciente" required><br><br>


             <input type="number" step="00.00" placeholder="Seu peso" name="peso" required><br><br>
            <input type="number" step="00.01" placeholder="Sua Altura" name="altura"  min="0.01"required><br><br>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
