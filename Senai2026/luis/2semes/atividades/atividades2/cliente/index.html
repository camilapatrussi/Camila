<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Recem-Chegados</title>
</head>
<body>
      <center>
        <H1>Cadastro de Clube</H1>
        <form action="http://localhost:3000" method="post">
            <input type="number" placeholder="Identificacao" name="id" required><br><br>

            Nome: <input type="text" placeholder="Nome do Time" name="nome" required><br><br>
            Vitorias: <input type="number" placeholder="Vitorias" name="vitorias" min="1"required><br><br>
            
            Empates: <input type="number" placeholder="Empates" name="empates" min="1"required><br><br>
            Derrotas: <input type="number" placeholder="Derrotas" name="derrotas" min="0"required><br><br>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>

        </form>
    </center>
</body>
</html>
